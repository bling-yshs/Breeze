name: Build Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      FLUTTER_ANDROID_KEYSTORE_BASE64: ${{ secrets.FLUTTER_ANDROID_KEYSTORE_BASE64 }}
      FLUTTER_KEYSTORE_PASSWORD: ${{ secrets.FLUTTER_KEYSTORE_PASSWORD }}
      FLUTTER_KEY_ALIAS: ${{ secrets.FLUTTER_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLUTTER_ANDROID_KEYSTORE_BASE64" || { echo "Missing FLUTTER_ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$FLUTTER_KEYSTORE_PASSWORD" || { echo "Missing FLUTTER_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$FLUTTER_KEY_ALIAS" || { echo "Missing FLUTTER_KEY_ALIAS"; exit 1; }

      - name: Restore Android signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FLUTTER_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/Breeze-key.keystore
          cat > android/key.properties <<KEYPROPS
          storePassword=$FLUTTER_KEYSTORE_PASSWORD
          keyPassword=$FLUTTER_KEYSTORE_PASSWORD
          keyAlias=$FLUTTER_KEY_ALIAS
          storeFile=../Breeze-key.keystore
          KEYPROPS

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/codeql
          sudo mkdir -p /usr/local/lib/android/sdk
          sudo chown -R "$USER":"$USER" /usr/local/lib/android
          docker system prune -a -f
          sudo apt-get clean

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Set up Flutter with FVM
        shell: bash
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install
          fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> "$GITHUB_PATH"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Read Android NDK version
        id: ndk-config
        shell: bash
        run: |
          NDK_VER=$(grep "ndkVersion" android/app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "ndk_version=$NDK_VER" >> "$GITHUB_OUTPUT"

      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ steps.ndk-config.outputs.ndk_version }}
          key: ${{ runner.os }}-android-ndk-${{ steps.ndk-config.outputs.ndk_version }}

      - name: Install Android NDK
        shell: bash
        run: yes | sdkmanager "ndk;${{ steps.ndk-config.outputs.ndk_version }}"

      - name: Install Android CMake
        shell: bash
        run: yes | sdkmanager "cmake;3.22.1"

      - name: Configure Android NDK environment
        shell: bash
        run: |
          NDK_VER=${{ steps.ndk-config.outputs.ndk_version }}
          ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VER"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        shell: bash
        run: yes | fvm flutter doctor --android-licenses || true

      - name: Install Flutter dependencies
        run: fvm flutter pub get

      - name: Cache Android waifu2x CLI dependencies
        uses: actions/cache@v5
        with:
          path: third_party/android_ncnn_deps
          key: ${{ runner.os }}-android-waifu2x-deps-${{ hashFiles('script/prepare_android_waifu2x_deps.py', 'script/build_ncnn_static_android.py', 'script/build_waifu2x_cli_android.py', 'android/app/src/main/cpp/waifu2x_cli/CMakeLists.txt') }}

      - name: Cache ncnn source
        uses: actions/cache@v5
        with:
          path: third_party/ncnn-src
          key: ${{ runner.os }}-android-ncnn-src-${{ hashFiles('script/build_ncnn_static_android.py') }}

      - name: Cache RealSR-NCNN-Android source
        uses: actions/cache@v5
        with:
          path: third_party/RealSR-NCNN-Android
          key: ${{ runner.os }}-android-realsr-src-${{ hashFiles('script/build_waifu2x_cli_android.py') }}

      - name: Prepare Android waifu2x CLI dependencies
        run: python3 script/prepare_android_waifu2x_deps.py

      - name: Build Android static ncnn
        run: python3 script/build_ncnn_static_android.py

      - name: Build Android waifu2x CLI
        run: python3 script/build_waifu2x_cli_android.py

      - name: Build signed APKs
        run: fvm dart ./script/build_apk.dart

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/skia/*.apk
          if-no-files-found: error
